version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Maven 3.9.x core exports slf4j-api 1.7.36
      - dependency-name: "org.slf4j:*"
        versions: [">= 2.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
